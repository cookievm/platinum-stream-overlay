<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Platinum Encounter Tracker</title>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<style>
:root{--purple:#7650ff;--label:#9477ff;--panel:#0c0b22;--white:#f8f8fb}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
body{display:flex;align-items:center;justify-content:center;font-family:Arial Black,Arial,sans-serif}
.card{width:2000px;height:300px;border:14px solid var(--purple);border-radius:76px;background:var(--panel);
box-shadow:0 0 20px #6032ff,0 0 36px #6032ff88;display:grid;grid-template-columns:820px 10px 1fr;
align-items:center;padding:26px 64px;gap:54px}
.label{color:var(--label);font-size:52px;font-weight:900;letter-spacing:5px;line-height:1;margin-bottom:20px}
.location{color:var(--white);font-size:100px;font-weight:900;line-height:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.divider{width:10px;height:205px;border-radius:8px;background:var(--label)}
.right{display:flex;align-items:center;gap:45px;min-width:0}.sprite{width:190px;height:190px;object-fit:contain;flex:0 0 190px;image-rendering:pixelated}
.text{color:var(--white);font-size:72px;font-weight:900;line-height:1.02}.nickname{font-size:88px;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dbg{display:none;position:fixed;left:8px;bottom:8px;background:#000e;color:#fff;padding:8px 12px;border-radius:6px;font:13px Consolas,monospace}
body.debug #dbg{display:block}
</style></head>
<body>
<div class="card"><div><div class="label" id="label">ROUTE</div><div class="location" id="location">ROUTE 201</div></div>
<div class="divider"></div><div class="right"><img class="sprite" id="sprite" src="pokeball.svg"><div class="text" id="state">ENCOUNTER<br>AVAILABLE</div></div></div>
<div id="dbg">Starting…</div>
<script>
(()=>{
 const Q=new URLSearchParams(location.search);
 const server=(Q.get('server')||'').trim(), port=(Q.get('port')||'443').trim(), user=(Q.get('user')||'').trim();
 if(Q.get('debug')==='1')document.body.classList.add('debug');
 const dbg=document.getElementById('dbg'), log=x=>{dbg.textContent=x;console.log('[encounter]',x)};
 const AREAS={}; for(let n=201;n<=230;n++)AREAS['route'+n]={type:'ROUTE',name:'ROUTE '+n,metIds:[]};
 Object.assign(AREAS,{
  jubilife:{type:'CITY',name:'JUBILIFE',metIds:[]},oreburgh:{type:'CITY',name:'OREBURGH',metIds:[]},
  floaroma:{type:'TOWN',name:'FLOAROMA',metIds:[]},eterna:{type:'CITY',name:'ETERNA',metIds:[]},
  hearthome:{type:'CITY',name:'HEARTHOME',metIds:[]},solaceon:{type:'TOWN',name:'SOLACEON',metIds:[]},
  veilstone:{type:'CITY',name:'VEILSTONE',metIds:[]},pastoria:{type:'CITY',name:'PASTORIA',metIds:[]},
  celestic:{type:'TOWN',name:'CELESTIC',metIds:[]},canalave:{type:'CITY',name:'CANALAVE',metIds:[]},
  snowpoint:{type:'CITY',name:'SNOWPOINT',metIds:[]},sunyshore:{type:'CITY',name:'SUNYSHORE',metIds:[]},
  eternaforest:{type:'AREA',name:'ETERNA FOREST',metIds:[]},oreburghmine:{type:'AREA',name:'OREBURGH MINE',metIds:[]}
 });
 let area=Q.get('area')||localStorage.getItem('pt-area')||'route201'; if(!AREAS[area])area='route201';
 let caught=JSON.parse(localStorage.getItem('pt-catches')||'{}');
 const label=document.getElementById('label'),loc=document.getElementById('location'),spr=document.getElementById('sprite'),state=document.getElementById('state');
 const save=()=>localStorage.setItem('pt-catches',JSON.stringify(caught));
 function spriteURL(p){const id=Number(p?.species);if(!id)return'';return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-iv/platinum/${p?.isShiny?'shiny/':''}${id}.png`}
 function draw(){const a=AREAS[area];label.textContent=a.type;loc.textContent=a.name;localStorage.setItem('pt-area',area);const c=caught[area];
  if(c){spr.src=c.sprite||'pokeball.svg';state.className='text nickname';state.textContent=c.nickname||c.speciesName||'Caught'}
  else{spr.src='pokeball.svg';state.className='text';state.innerHTML='ENCOUNTER<br>AVAILABLE'}}
 function party(xs){if(!Array.isArray(xs))return;xs.forEach(m=>{const p=m?.pokemon||m;if(!p)return;
   console.log('[encounter] Pokémon', {nickname:p.nickname,species:p.species,speciesName:p.speciesName,locationMet:p.locationMet,pid:p.pid});
   if(!caught[area]&&AREAS[area].metIds.includes(Number(p.locationMet))){caught[area]={nickname:p.nickname,speciesName:p.speciesName,sprite:spriteURL(p),locationMet:p.locationMet,pid:p.pid};save();draw()}
  })}
 function connect(){
  if(!server){log('Add ?server=YOUR_SERVER&port=443&user=YOUR_USER');return}
  let base=/^https?:\/\//i.test(server)?server:`https://${server}`;
  if(port && port!=='443' && !new RegExp(':'+port+'$').test(base))base+=':'+port;
  log('Connecting to '+base);
  const socket=io(base,{transports:['websocket','polling'],reconnection:true,rejectUnauthorized:false});
  socket.on('connect',()=>log('Connected • '+AREAS[area].name));
  socket.on('connect_error',e=>log('Connection error: '+(e?.message||e)));
  socket.on('client:players:list',players=>{if(!Array.isArray(players))return;const p=user?players.find(x=>String(x.username).toLowerCase()===user.toLowerCase()):players[0];if(p)party(p.party||[])});
  socket.on('client:party:updated',d=>{if(user&&d?.username&&String(d.username).toLowerCase()!==user.toLowerCase())return;party(d?.update?.party||d)});
 }
 window.encounterTracker={
  setArea:k=>{if(AREAS[k]){area=k;draw()}},
  markCaught:(nickname,species)=>{caught[area]={nickname,sprite:`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-iv/platinum/${species}.png`};save();draw()},
  available:()=>{delete caught[area];save();draw()},
  resetAll:()=>{caught={};save();draw()},
  setMetId:(k,id)=>{if(AREAS[k]&&!AREAS[k].metIds.includes(Number(id)))AREAS[k].metIds.push(Number(id))},
  areas:AREAS
 };
 draw();connect();
})();
</script></body></html>
