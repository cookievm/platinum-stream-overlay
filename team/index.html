<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Platinum Team — Party Cards</title>
<style>
:root{--purple:#6335f5;--purple2:#9148ff;--panel1:#171443;--panel2:#0b0927}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
body{display:flex;align-items:center;justify-content:center;font-family:"Arial Black","Trebuchet MS",Arial,sans-serif}
#team{width:100vw;height:auto;aspect-ratio:6/1.18;padding:.55vw;display:grid;grid-template-columns:repeat(6,1fr);gap:.48vw;background:transparent!important}
.slot{position:relative;min-width:0;min-height:0;overflow:hidden;aspect-ratio:1/1.18;border:clamp(3px,.28vw,7px) solid var(--purple);border-radius:clamp(12px,1.1vw,26px);background:linear-gradient(180deg,var(--panel1),var(--panel2));box-shadow:inset 0 0 0 2px rgba(145,72,255,.28),0 0 13px rgba(99,53,245,.45);display:grid;grid-template-rows:minmax(0,1fr) auto 18%;padding:3.5% 5% 4%}
.slot.empty{visibility:hidden}
.ball{position:absolute;left:5%;top:4%;width:clamp(18px,2.2vw,40px);aspect-ratio:1;border-radius:50%;background:linear-gradient(#f23855 0 44%,#101018 44% 56%,#f8f8f8 56%);border:2px solid #080716;box-shadow:0 1px 3px #000}
.ball:after{content:"";position:absolute;width:27%;aspect-ratio:1;border-radius:50%;background:#fff;border:2px solid #111;left:36%;top:36%}
.gender{position:absolute;right:5%;top:2%;font-weight:1000;font-size:clamp(21px,2.8vw,50px);line-height:1;text-shadow:0 3px 0 #060615}.male{color:#409eff}.female{color:#ff3d91}.unknown{display:none}
.spriteWrap{display:flex;align-items:center;justify-content:center;min-height:0;padding-top:2%}
.sprite{max-width:98%;max-height:100%;width:auto;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;filter:drop-shadow(0 4px 2px rgba(0,0,0,.55))}
.name,.hpText{color:#fff;font-weight:1000;text-align:center;white-space:nowrap;text-shadow:-2px -2px 0 #08080e,2px -2px 0 #08080e,-2px 2px 0 #08080e,2px 2px 0 #08080e,0 4px 0 #08080e}
.name{text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;font-size:clamp(11px,1.55vw,30px);letter-spacing:-.06em;line-height:1.05;margin:0 0 3%}
.hpArea{display:grid;grid-template-rows:auto minmax(1em,auto);gap:4%;padding:0 0 2%;overflow:visible}.hpTrack{height:clamp(10px,1.18vw,21px);border-radius:999px;background:#ececec;padding:clamp(2px,.16vw,4px);box-shadow:0 0 0 2px #09081c,0 2px 4px #000}
.hpFill{height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,#15c96c,#38ed92);transition:width .3s ease}
.hpText{display:block;width:100%;text-align:center;color:#fff;font-weight:1000;font-size:clamp(10px,1.15vw,22px);letter-spacing:-.045em;line-height:1;min-height:1em;text-shadow:-2px -2px 0 #08080e,2px -2px 0 #08080e,-2px 2px 0 #08080e,2px 2px 0 #08080e,0 3px 0 #08080e}
</style></head>
<body><div id="team"></div>
<script type="module">
import { V2 } from "./pokelink.js";
const q=new URLSearchParams(location.search),host=q.get("server")||"localhost",port=Number(q.get("port")||3000),users=q.get("users")||"cookievm",team=document.getElementById("team");
for(let i=0;i<6;i++)team.insertAdjacentHTML("beforeend",`<div class="slot empty" id="s${i}"><div class="ball"></div><div class="gender unknown" id="g${i}"></div><div class="spriteWrap"><img class="sprite" id="p${i}"></div><div class="name" id="n${i}"></div><div class="hpArea"><div class="hpTrack"><div class="hpFill" id="h${i}"></div></div><div class="hpText" id="t${i}"></div></div></div>`);
function get(o,...ks){for(const k of ks)if(o&&o[k]!=null)return o[k];return null}
function ps(mon){const id=Number(mon?.species);if(!Number.isInteger(id)||id<1||id>493)return null;const sh=mon?.isShiny===true?"shiny/":"",f=String(mon?.gender||"").toLowerCase()==="female"?"female/":"";const r="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-iv/platinum/";return{a:`${r}${sh}${f}${id}.png`,b:`${r}${sh}${id}.png`}}
function render(party){for(let i=0;i<6;i++){const m=party?.[i],box=document.getElementById("s"+i);if(!m||!V2.isValidPokemon(m)){box.classList.add("empty");continue}box.classList.remove("empty");const u=ps(m),im=document.getElementById("p"+i);if(u){im.onerror=()=>{if(im.src!==u.b){im.onerror=null;im.src=u.b}};im.src=u.a}
document.getElementById("n"+i).textContent=String(get(m,"nickname","name")||"POKÉMON");
const cur=Number(get(m,"currentHP","currentHp","hp")??0),max=Number(get(m,"maxHP","maxHp","hpMax")??0),pct=max>0?Math.max(0,Math.min(100,cur/max*100)):100,bar=document.getElementById("h"+i);bar.style.width=pct+"%";bar.style.background=pct<=20?"#ef3f5b":pct<=50?"#f2c43d":"linear-gradient(90deg,#15c96c,#38ed92)";document.getElementById("t"+i).textContent=max>0?`${cur} / ${max}`:"";
const g=String(get(m,"gender")||"").toLowerCase(),ge=document.getElementById("g"+i);ge.className="gender "+(g==="male"?"male":g==="female"?"female":"unknown");ge.textContent=g==="male"?"♂":g==="female"?"♀":""}}
V2.onPartyUpdate((party,username)=>{if(!username||username===users)render(party)});
V2.initialize({numberOfPlayers:1,listenForSpriteUpdates:false,host,port,users:[users],useFallbackSprites:true});
</script></body></html>
