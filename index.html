<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Platinum Next Gym</title>
<style>
:root{--ink:#f8fbff}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:transparent !important;
  font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink)
}
.wrap{width:100%;height:100%;padding:8px;background:transparent !important}
.next{
  height:100%;position:relative;padding:9px 14px;
  border:2px solid rgba(95,92,255,.9);border-radius:18px;
  background:transparent !important;
  box-shadow:0 0 0 3px rgba(63,43,255,.16);
  display:grid;grid-template-columns:auto 1fr auto;
  align-items:center;gap:12px;overflow:hidden
}
.spriteBox{width:58px;height:58px;display:grid;place-items:center}
.sprite{
  max-width:58px;max-height:58px;image-rendering:pixelated;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.8))
}
.label{
  font-size:9px;letter-spacing:.18em;font-weight:900;color:#c3c8ff;
  margin-bottom:1px;text-shadow:0 2px 4px #000,0 0 8px #000
}
.name{
  font-size:21px;font-weight:950;line-height:1;
  text-shadow:0 2px 5px #000,0 0 10px #000
}
.city{
  font-size:10px;color:#fff;margin-top:4px;
  text-shadow:0 2px 4px #000,0 0 8px #000
}
.caps{display:flex;gap:16px;align-items:end;text-align:right}
.stat{min-width:75px}
.stat small{
  display:block;font-size:7px;line-height:1.1;letter-spacing:.08em;
  font-weight:900;color:#e0e3ff;max-width:80px;
  text-shadow:0 2px 4px #000,0 0 8px #000
}
.stat strong{
  display:block;font-size:29px;line-height:1;color:white;
  text-shadow:0 2px 5px #000,0 0 18px #63d8ff
}
.status{
  position:absolute;right:12px;bottom:4px;font-size:6px;
  letter-spacing:.1em;color:#ddd;text-shadow:0 1px 3px #000
}
</style>
</head>
<body>
<div class="wrap">
  <div class="next">
    <div class="spriteBox"><img id="sprite" class="sprite" alt=""></div>
    <div>
      <div class="label" id="nextLabel">NEXT GYM</div>
      <div class="name" id="nextName">ROARK</div>
      <div class="city" id="nextCity">Oreburgh City</div>
    </div>
    <div class="caps">
      <div class="stat"><small>ACE POKÉMON LEVEL</small><strong id="ace">14</strong></div>
      <div class="stat"><small>LEVEL CAP</small><strong id="cap">12</strong></div>
    </div>
    <div class="status" id="status">POKÉLINK SEARCHING</div>
  </div>
</div>

<script>
const encounters=[
 ['Roark','Oreburgh City',14,12,'gym','Spr_Pt_Roark.png'],
 ['Gardenia','Eterna City',22,19,'gym','Spr_Pt_Gardenia.png'],
 ['Fantina','Hearthome City',26,22,'gym','Spr_Pt_Fantina.png'],
 ['Maylene','Veilstone City',32,27,'gym','Spr_Pt_Maylene.png'],
 ['Crasher Wake','Pastoria City',37,31,'gym','Spr_Pt_Crasher_Wake.png'],
 ['Byron','Canalave City',41,34,'gym','Spr_Pt_Byron.png'],
 ['Candice','Snowpoint City',44,36,'gym','Spr_Pt_Candice.png'],
 ['Volkner','Sunyshore City',50,41,'gym','Spr_Pt_Volkner.png'],
 ['Aaron','Pokémon League',53,43,'elite','Spr_Pt_Aaron.png'],
 ['Bertha','Pokémon League',55,45,'elite','Spr_Pt_Bertha.png'],
 ['Flint','Pokémon League',57,47,'elite','Spr_Pt_Flint.png'],
 ['Lucian','Pokémon League',59,49,'elite','Spr_Pt_Lucian.png'],
 ['Cynthia','Pokémon League',62,50,'champion','Spr_Pt_Cynthia.png']
];

const q=new URLSearchParams(location.search);
let completed=Math.max(0,Math.min(13,parseInt(q.get('progress')||q.get('badges')||'0')||0));

function render(){
  const g=encounters[Math.min(completed,12)];
  nextLabel.textContent=completed>=13?'NUZLOCKE COMPLETE':
    g[4]==='gym'?'NEXT GYM':g[4]==='elite'?'NEXT ELITE FOUR':'CHAMPION';
  nextName.textContent=completed>=13?'SINNOH COMPLETE':g[0].toUpperCase();
  nextCity.textContent=g[1];
  ace.textContent=g[2];
  cap.textContent=g[3];
  sprite.src='https://archives.bulbagarden.net/wiki/Special:Redirect/file/'+g[5];
  sprite.style.visibility=completed>=13?'hidden':'visible';
}
render();

function badgeCount(o){
  const b=o?.trainer?.badges ?? o?.update?.trainer?.badges ?? o?.badges ?? o?.update?.badges;
  if(!Array.isArray(b)) return null;
  return b.filter(x=>x===true || x?.value===true || x?.obtained===true || x?.earned===true).length;
}

function apply(data){
  for(const p of (Array.isArray(data)?data:[data]).filter(Boolean)){
    const n=badgeCount(p);
    if(n!==null){
      completed=Math.max(completed,Math.min(8,n));
      render();
      return;
    }
  }
}

function loadSocket(port){
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='http://127.0.0.1:'+port+'/socket.io/socket.io.js';
    s.onload=()=>resolve(port);
    s.onerror=reject;
    document.head.appendChild(s);
  });
}

(async()=>{
  const ports=q.get('port')?[q.get('port')]:['8080','3000','8000','5000','8888'];
  for(const p of ports){
    try{
      await loadSocket(p);
      if(typeof io==='undefined') continue;
      const s=io('http://127.0.0.1:'+p,{reconnection:true,timeout:1800});
      s.on('connect',()=>status.textContent='POKÉLINK CONNECTED');
      s.on('disconnect',()=>status.textContent='POKÉLINK RECONNECTING');
      ['client:players:list','player:trainer:updated','client:badges:updated']
        .forEach(event=>s.on(event,apply));
      return;
    }catch(_){}
  }
  status.textContent='MANUAL MODE • ?progress=0–13';
})();
</script>
</body>
</html>
